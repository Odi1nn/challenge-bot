<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Челлендж: Путь к iPad</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:        #0f0e17;
    --card:      #1c1b2e;
    --border:    #2e2b4a;
    --purple:    #7c6fef;
    --pink:      #ec4899;
    --green:     #22c55e;
    --text:      #e8e6f0;
    --muted:     #6b6884;
    --radius:    12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding-bottom: 24px;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #6c63ff 0%, #a855f7 55%, #ec4899 100%);
    padding: 20px 16px 16px;
    text-align: center;
  }
  .header h1 { font-size: 20px; font-weight: 900; letter-spacing: 0.4px; margin-bottom: 4px; }
  .header .subtitle { font-size: 12px; opacity: 0.88; font-weight: 600; margin-bottom: 14px; }

  /* ── PROGRESS BAR ── */
  .progress-wrap { padding: 0 16px; margin-top: -4px; }
  .progress-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-top: 10px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-label { font-size: 13px; font-weight: 700; color: var(--text); }
  .progress-count { font-size: 22px; font-weight: 900; color: var(--purple); }
  .progress-count span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .bar-bg {
    height: 10px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6c63ff, #ec4899);
    border-radius: 99px;
    transition: width 0.4s ease;
    min-width: 4px;
  }

  /* ── LIVES ── */
  .lives-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }
  .lives-label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .hearts { display: flex; gap: 4px; }
  .heart { font-size: 20px; transition: transform 0.2s; }
  .heart.dead { filter: grayscale(1); opacity: 0.3; }
  .use-life-btn {
    background: transparent;
    border: 1px solid #ef4444;
    color: #ef4444;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .use-life-btn:active { background: rgba(239,68,68,0.15); }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 11px;
    font-weight: 900;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 18px 16px 8px;
  }

  /* ── MONTH CARD ── */
  .month-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 0 16px 12px;
    overflow: hidden;
  }
  .month-header {
    background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(236,72,153,0.10));
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .month-stat { font-size: 11px; color: var(--muted); font-weight: 600; }

  /* ── WEEK ROWS ── */
  .week-row {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .week-row:last-child { border-bottom: none; }
  .week-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--muted);
    width: 36px;
    flex-shrink: 0;
    text-align: right;
    padding-right: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .squares { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── DAY SQUARE ── */
  .sq {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
    user-select: none;
  }
  .sq .day-name { font-size: 9px; font-weight: 700; color: var(--muted); line-height: 1; }
  .sq .day-num  { font-size: 11px; font-weight: 800; color: var(--text); line-height: 1.3; }
  .sq .checkmark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  /* completed state */
  .sq.done {
    background: rgba(34,197,94,0.12);
    border-color: #22c55e;
  }
  .sq.done .day-name,
  .sq.done .day-num { opacity: 0.3; }
  .sq.done .checkmark { opacity: 1; }

  /* future day — slightly dimmed */
  .sq.future { opacity: 0.45; }

  /* today */
  .sq.today {
    border-color: var(--purple);
    box-shadow: 0 0 0 2px rgba(124,111,239,0.3);
  }
  .sq.today .day-num { color: var(--purple); }

  .sq:active { transform: scale(0.9); }

  /* ── CELEBRATION ── */
  .celebration {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 99;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .celebration.show { display: flex; }
  .celebration h2 { font-size: 32px; font-weight: 900; margin-bottom: 12px; }
  .celebration p { font-size: 16px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .celebration button {
    background: linear-gradient(135deg, #6c63ff, #ec4899);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #22c55e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    transition: transform 0.3s ease;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.red { background: #ef4444; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>🚀 Путь к iPad</h1>
  <div class="subtitle">1 октября — 30 ноября 2026 &nbsp;|&nbsp; Приз: iPad 📱</div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-card">
    <div class="progress-top">
      <div class="progress-label">📊 Прогресс</div>
      <div class="progress-count" id="count">0 <span>/ 43</span></div>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>

    <!-- LIVES -->
    <div class="lives-row">
      <div>
        <div class="lives-label">Жизни</div>
        <div class="hearts" id="hearts"></div>
      </div>
      <button class="use-life-btn" onclick="useLife()">Использовать жизнь</button>
    </div>
  </div>
</div>

<!-- OCTOBER -->
<div class="section-title">🍂 Октябрь 2026</div>
<div class="month-card">
  <div class="month-header">
    Октябрь <span class="month-stat" id="oct-stat">0 / 22</span>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 1</div>
    <div class="squares" id="week-oct-1"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 2</div>
    <div class="squares" id="week-oct-2"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 3</div>
    <div class="squares" id="week-oct-3"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 4</div>
    <div class="squares" id="week-oct-4"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 5</div>
    <div class="squares" id="week-oct-5"></div>
  </div>
</div>

<!-- NOVEMBER -->
<div class="section-title">❄️ Ноябрь 2026</div>
<div class="month-card">
  <div class="month-header">
    Ноябрь <span class="month-stat" id="nov-stat">0 / 21</span>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 1</div>
    <div class="squares" id="week-nov-1"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 2</div>
    <div class="squares" id="week-nov-2"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 3</div>
    <div class="squares" id="week-nov-3"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 4</div>
    <div class="squares" id="week-nov-4"></div>
  </div>
  <div class="week-row">
    <div class="week-label">Нед 5</div>
    <div class="squares" id="week-nov-5"></div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="celebration" id="celebration">
  <div style="font-size:64px;margin-bottom:16px">🎉</div>
  <h2>Ты сделала это!</h2>
  <p>Все 43 дня выполнены!<br>iPad твой! 📱🏆</p>
  <button onclick="document.getElementById('celebration').classList.remove('show')">Ура! 🎊</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────
// Data: all 43 school days
// ─────────────────────────────────────────
const DAYS = {
  "week-oct-1": [
    { date: "2026-10-01", name: "Чт", num: "01.10" },
    { date: "2026-10-02", name: "Пт", num: "02.10" },
  ],
  "week-oct-2": [
    { date: "2026-10-05", name: "Пн", num: "05.10" },
    { date: "2026-10-06", name: "Вт", num: "06.10" },
    { date: "2026-10-07", name: "Ср", num: "07.10" },
    { date: "2026-10-08", name: "Чт", num: "08.10" },
    { date: "2026-10-09", name: "Пт", num: "09.10" },
  ],
  "week-oct-3": [
    { date: "2026-10-12", name: "Пн", num: "12.10" },
    { date: "2026-10-13", name: "Вт", num: "13.10" },
    { date: "2026-10-14", name: "Ср", num: "14.10" },
    { date: "2026-10-15", name: "Чт", num: "15.10" },
    { date: "2026-10-16", name: "Пт", num: "16.10" },
  ],
  "week-oct-4": [
    { date: "2026-10-19", name: "Пн", num: "19.10" },
    { date: "2026-10-20", name: "Вт", num: "20.10" },
    { date: "2026-10-21", name: "Ср", num: "21.10" },
    { date: "2026-10-22", name: "Чт", num: "22.10" },
    { date: "2026-10-23", name: "Пт", num: "23.10" },
  ],
  "week-oct-5": [
    { date: "2026-10-26", name: "Пн", num: "26.10" },
    { date: "2026-10-27", name: "Вт", num: "27.10" },
    { date: "2026-10-28", name: "Ср", num: "28.10" },
    { date: "2026-10-29", name: "Чт", num: "29.10" },
    { date: "2026-10-30", name: "Пт", num: "30.10" },
  ],
  "week-nov-1": [
    { date: "2026-11-02", name: "Пн", num: "02.11" },
    { date: "2026-11-03", name: "Вт", num: "03.11" },
    { date: "2026-11-04", name: "Ср", num: "04.11" },
    { date: "2026-11-05", name: "Чт", num: "05.11" },
    { date: "2026-11-06", name: "Пт", num: "06.11" },
  ],
  "week-nov-2": [
    { date: "2026-11-09", name: "Пн", num: "09.11" },
    { date: "2026-11-10", name: "Вт", num: "10.11" },
    { date: "2026-11-11", name: "Ср", num: "11.11" },
    { date: "2026-11-12", name: "Чт", num: "12.11" },
    { date: "2026-11-13", name: "Пт", num: "13.11" },
  ],
  "week-nov-3": [
    { date: "2026-11-16", name: "Пн", num: "16.11" },
    { date: "2026-11-17", name: "Вт", num: "17.11" },
    { date: "2026-11-18", name: "Ср", num: "18.11" },
    { date: "2026-11-19", name: "Чт", num: "19.11" },
    { date: "2026-11-20", name: "Пт", num: "20.11" },
  ],
  "week-nov-4": [
    { date: "2026-11-23", name: "Пн", num: "23.11" },
    { date: "2026-11-24", name: "Вт", num: "24.11" },
    { date: "2026-11-25", name: "Ср", num: "25.11" },
    { date: "2026-11-26", name: "Чт", num: "26.11" },
    { date: "2026-11-27", name: "Пт", num: "27.11" },
  ],
  "week-nov-5": [
    { date: "2026-11-30", name: "Пн", num: "30.11" },
  ],
};

// ─────────────────────────────────────────
// State
// ─────────────────────────────────────────
let progress = {};   // { "2026-10-01": true, ... }
let lives    = 3;
const today  = new Date().toISOString().slice(0, 10);

// ─────────────────────────────────────────
// Telegram Web App init
// ─────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

// ─────────────────────────────────────────
// Render all squares
// ─────────────────────────────────────────
function renderSquares() {
  for (const [weekId, days] of Object.entries(DAYS)) {
    const container = document.getElementById(weekId);
    if (!container) continue;
    container.innerHTML = '';
    for (const day of days) {
      const done   = !!progress[day.date];
      const isToday = day.date === today;
      const isFuture = day.date > today;

      const sq = document.createElement('div');
      sq.className = 'sq' +
        (done    ? ' done'   : '') +
        (isToday ? ' today'  : '') +
        (isFuture && !done ? ' future' : '');
      sq.dataset.date = day.date;
      sq.innerHTML = `
        <div class="day-name">${day.name}</div>
        <div class="day-num">${day.num}</div>
        <div class="checkmark">✅</div>
      `;
      sq.addEventListener('click', () => toggleDay(day.date));
      container.appendChild(sq);
    }
  }
  updateStats();
}

// ─────────────────────────────────────────
// Update counters & bar
// ─────────────────────────────────────────
function updateStats() {
  const total  = 43;
  const done   = Object.values(progress).filter(Boolean).length;
  const pct    = Math.round(done / total * 100);

  document.getElementById('count').innerHTML = `${done} <span>/ ${total}</span>`;
  document.getElementById('bar').style.width  = pct + '%';

  // month stats
  const octDays = Object.entries(DAYS)
    .filter(([k]) => k.startsWith('week-oct'))
    .flatMap(([, v]) => v);
  const novDays = Object.entries(DAYS)
    .filter(([k]) => k.startsWith('week-nov'))
    .flatMap(([, v]) => v);

  const octDone = octDays.filter(d => progress[d.date]).length;
  const novDone = novDays.filter(d => progress[d.date]).length;
  document.getElementById('oct-stat').textContent = `${octDone} / 22`;
  document.getElementById('nov-stat').textContent = `${novDone} / 21`;

  // lives hearts
  const heartsEl = document.getElementById('hearts');
  heartsEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= lives ? ' dead' : '');
    h.textContent = '❤️';
    heartsEl.appendChild(h);
  }

  // celebration
  if (done >= total) {
    setTimeout(() => document.getElementById('celebration').classList.add('show'), 400);
  }
}

// ─────────────────────────────────────────
// Toggle a day
// ─────────────────────────────────────────
async function toggleDay(date) {
  try {
    const res  = await fetch(`/api/toggle/${date}`, { method: 'POST' });
    const data = await res.json();
    progress[date] = data.completed;

    // animate the square
    const sq = document.querySelector(`.sq[data-date="${date}"]`);
    if (sq) {
      sq.classList.toggle('done', data.completed);
      if (data.completed) {
        sq.style.transform = 'scale(1.15)';
        setTimeout(() => sq.style.transform = '', 200);
        showToast('✅ День засчитан!', false);
      } else {
        showToast('↩️ Отменено', false);
      }
    }
    updateStats();
  } catch (e) {
    showToast('❌ Ошибка соединения', true);
  }
}

// ─────────────────────────────────────────
// Use a life
// ─────────────────────────────────────────
async function useLife() {
  if (lives <= 0) { showToast('💔 Жизней нет!', true); return; }
  if (!confirm('Использовать одну жизнь?')) return;
  try {
    const res  = await fetch('/api/life/use', { method: 'POST' });
    const data = await res.json();
    lives = data.lives;
    updateStats();
    showToast(`💔 Жизнь потрачена. Осталось: ${lives}`, true);
  } catch (e) {
    showToast('❌ Ошибка', true);
  }
}

// ─────────────────────────────────────────
// Toast
// ─────────────────────────────────────────
let toastTimer;
function showToast(msg, isRed) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show' + (isRed ? ' red' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────
// Load initial data & render
// ─────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch('/api/progress');
    const data = await res.json();
    progress = data.progress || {};
    lives    = data.lives    ?? 3;
  } catch (e) {
    console.warn('Could not load progress, using empty state');
  }
  renderSquares();
}

init();
</script>
</body>
</html>
